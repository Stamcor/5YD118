# Local infrastructure for development. Run: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pilates
      POSTGRES_PASSWORD: pilates
      POSTGRES_DB: pilates
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pilates']
      interval: 5s
      retries: 10
volumes:
  pgdata:
