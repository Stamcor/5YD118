name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  requirements:
    name: Requirements & traceability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Zero-dependency scripts: no install needed.
      - run: node scripts/agent-workspace.mjs --check
      - run: node scripts/req-trace.mjs --strict --json req-trace.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: req-trace
          path: req-trace.json

  verify:
    name: Format, lint, typecheck, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pilates
          POSTGRES_PASSWORD: pilates
          POSTGRES_DB: pilates_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pilates" --health-interval 5s --health-retries 10
    env:
      # PLAT-012: concurrency tests (e.g. BOOK-002) run against real Postgres in CI.
      TEST_DATABASE_URL: postgres://pilates:pilates@localhost:5432/pilates_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm req:check

  containers:
    name: Containers (podman-compose up)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install podman-compose==1.5.0
      # PLAT-013: the whole stack must start with podman-compose up.
      - run: scripts/compose-smoke.sh

  e2e:
    name: End-to-end
    # PLAT-011/AC2: enable with repository variable E2E_ENABLED=true once journeys exist.
    if: vars.E2E_ENABLED == 'true'
    needs: verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pilates
          POSTGRES_PASSWORD: pilates
          POSTGRES_DB: pilates
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pilates" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://pilates:pilates@localhost:5432/pilates
      SESSION_SECRET: ci-session-secret-ci-session-secret-1234
      WEB_ORIGIN: http://localhost:5173
      ADMIN_ORIGIN: http://localhost:5174
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_TEST_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pilates/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
